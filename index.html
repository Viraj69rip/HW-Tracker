<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viraj's Homework Hub</title>
    <style>
        /* Premium Dark Theme */
        :root {
            --bg-base: #09090b; 
            --bg-card: #18181b; 
            --bg-hover: #27272a;
            --border: #3f3f46;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --primary: #3b82f6; 
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981; 
            --radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0 0 40px 0;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Navigation Bar */
        nav {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 15px 0;
            margin-bottom: 40px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            color: var(--text-main);
            background: var(--bg-hover);
        }

        .nav-btn.active {
            background: var(--primary);
            color: white;
        }

        /* Header & Progress */
        header {
            text-align: center;
            margin-bottom: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { font-size: 2.5rem; margin: 0 0 8px 0; }
        .subtitle { color: var(--text-muted); margin: 0 0 30px 0; }

        .progress-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            width: 100%;
            max-width: 600px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .progress-track {
            width: 100%;
            height: 12px;
            background: var(--bg-base);
            border-radius: 99px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.4s ease;
            border-radius: 99px;
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 24px;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
        }

        .card h2 {
            margin: 0 0 20px 0;
            font-size: 1.25rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        /* File Links */
        .file-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .file-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary);
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            border: 1px solid rgba(59, 130, 246, 0.2);
            transition: all 0.2s;
        }

        .file-btn:hover {
            background: rgba(59, 130, 246, 0.2);
        }
        
        .file-btn-content {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Tasks */
        .task-list {
            list-style: none; padding: 0; margin: 0;
            display: flex; flex-direction: column; gap: 14px;
        }

        .task-label {
            display: flex; align-items: flex-start; gap: 12px;
            cursor: pointer; color: var(--text-muted);
        }
        .task-label:hover { color: var(--text-main); }

        .task-label input[type="checkbox"] {
            appearance: none; width: 20px; height: 20px;
            border: 2px solid #52525b; border-radius: 6px;
            margin-top: 2px; flex-shrink: 0; cursor: pointer;
            position: relative;
        }

        .task-label input[type="checkbox"]:checked {
            background-color: var(--primary); border-color: var(--primary);
        }

        .task-label input[type="checkbox"]:checked::after {
            content: ""; position: absolute; left: 5px; top: 1px;
            width: 4px; height: 10px; border: solid white;
            border-width: 0 2px 2px 0; transform: rotate(45deg);
        }

        .task-label input[type="checkbox"]:checked ~ .task-text {
            text-decoration: line-through; opacity: 0.5;
        }

        /* Link Manager Forms */
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-control {
            background: var(--bg-base);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 1rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .btn-primary:hover { background: var(--primary-hover); }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-danger:hover {
            background: var(--danger);
            color: white;
        }

        /* Toast */
        #toast {
            position: fixed; bottom: 30px; right: 30px;
            background: var(--success); color: white;
            padding: 12px 24px; border-radius: 8px;
            transform: translateY(100px); opacity: 0;
            transition: all 0.3s ease; z-index: 1000;
        }
        #toast.show { transform: translateY(0); opacity: 1; }

        /* View Toggling */
        .view-section { display: none; }
        .view-section.active { display: block; }
        
        .manager-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .manager-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-content">
            <div class="nav-brand">Viraj HW Hub</div>
            <div class="nav-links">
                <button class="nav-btn active" onclick="switchView('dashboard')" id="btn-dashboard">Dashboard</button>
                <button class="nav-btn" onclick="switchView('manager')" id="btn-manager">Manage Links</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="view-dashboard" class="view-section active">
            <header>
                <h1>Holiday Homework</h1>
                <p class="subtitle">Class X - Auto-saving to browser storage</p>
                
                <div class="progress-card">
                    <div class="progress-header">
                        <span>Overall Completion</span>
                        <span id="progressText" style="color: var(--primary);">0%</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progressBar"></div>
                    </div>
                </div>
            </header>

            <main class="grid" id="checklistContainer"></main>
        </div>

        <div id="view-manager" class="view-section">
            <header>
                <h1>Manage File Links</h1>
                <p class="subtitle">Link your PDFs, Docs, and Google Drive URLs to subjects</p>
            </header>
            
            <div class="manager-layout">
                <div class="card">
                    <h2>Add New Link</h2>
                    <form id="linkForm" onsubmit="handleLinkSubmit(event)">
                        <div class="form-group">
                            <label>Subject</label>
                            <select class="form-control" id="linkSubject" required></select>
                        </div>
                        <div class="form-group">
                            <label>Display Name (e.g., Open Physics PPT)</label>
                            <input type="text" class="form-control" id="linkName" placeholder="Enter name" required>
                        </div>
                        <div class="form-group">
                            <label>File Path or URL</label>
                            <input type="text" class="form-control" id="linkUrl" placeholder="./resources/file.pdf or https://..." required>
                        </div>
                        <button type="submit" class="btn-primary">Add Link</button>
                    </form>
                </div>

                <div class="card">
                    <h2>Current Links</h2>
                    <div id="currentLinksList">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast">✅ Auto-saved!</div>

    <script>
        const fileIcon = `<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>`;

        // Base Tasks Data
        const baseTasks = {
            "English": ["Prepare 15-page PPT on African History (Nelson Mandela)", "Include colored pictures in PPT"],
            "Hindi": ["15-day Yoga Camp Ad", "Letter to Bank Manager", "Paragraph: Plastic-free India", "Notice: Educational Tour", "Favorite short story"],
            "Marathi": ["Info on a Saint", "Complaint letter", "Two essays", "Story with Title & Moral", "Types of Marathi literature"],
            "Physics": ["PPT on Light & Electricity as PDF", "Rename file properly", "Upload to Google Drive", "Submit printed copy"],
            "Computer (I.T.)": ["2-3 page doc on Digital Documentation", "Apply text styles & formatting"],
            "Mathematics": ["Practice Sheet: Real Numbers", "Practice Sheet: Polynomials", "Practice Sheet: Linear Equations"],
            "Biology": ["Life processes mind map", "4 labelled diagrams (Alimentary, Heart, Respiratory, Excretory)"],
            "Chemistry": ["Chemical Reactions mind map", "Balanced equations on punched papers"],
            "Social Science": ["Group PPT on Great Depression", "Upload project to Google Forms", "Project: Consumer Rights, Social Issues, or Sustainable Dev."]
        };

        // State Management
        let savedProgress = JSON.parse(localStorage.getItem('viraj_progress')) || {};
        let savedLinks = JSON.parse(localStorage.getItem('viraj_links')) || {
            // Default Links to get you started
            "English": [{ name: "Open English PPT", url: "./resources/Viraj Chavan PPT 10B English.pptx" }],
            "Physics": [{ name: "Open Physics PDF", url: "./resources/Viraj Chavan 10B Physics.pdf" }],
            "Hindi": [{ name: "Open Hindi PPT", url: "./resources/Viraj Chavan 10 B Hindi.pptx" }],
            "Computer (I.T.)": [{ name: "Open I.T. Doc", url: "./resources/Viraj Chavan Document I.T.docx" }]
        };

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            populateSubjectDropdown();
            renderDashboard();
            renderLinkManager();
        });

        // --- UI View Switching ---
        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`view-${viewName}`).classList.add('active');
            document.getElementById(`btn-${viewName}`).classList.add('active');

            if(viewName === 'dashboard') renderDashboard();
        }

        // --- Dashboard Rendering ---
        function renderDashboard() {
            const container = document.getElementById('checklistContainer');
            container.innerHTML = '';
            let totalTasks = 0;
            let completedTasks = 0;

            Object.keys(baseTasks).forEach((subjectName, subIndex) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<h2>${subjectName}</h2>`;

                // Render File Links for this subject
                const subjectLinks = savedLinks[subjectName] || [];
                if (subjectLinks.length > 0) {
                    const fileDiv = document.createElement('div');
                    fileDiv.className = 'file-links';
                    subjectLinks.forEach(link => {
                        fileDiv.innerHTML += `
                            <a href="${link.url}" target="_blank" class="file-btn">
                                <div class="file-btn-content">${fileIcon} ${link.name}</div>
                            </a>
                        `;
                    });
                    card.appendChild(fileDiv);
                }

                // Render Checkboxes
                const ul = document.createElement('ul');
                ul.className = 'task-list';
                baseTasks[subjectName].forEach((task, taskIndex) => {
                    totalTasks++;
                    const taskId = `task_${subIndex}_${taskIndex}`;
                    const isChecked = savedProgress[taskId] === true;
                    if(isChecked) completedTasks++;

                    const li = document.createElement('li');
                    li.innerHTML = `
                        <label class="task-label">
                            <input type="checkbox" id="${taskId}" ${isChecked ? 'checked' : ''} onchange="toggleTask('${taskId}', this.checked)">
                            <span class="task-text">${task}</span>
                        </label>
                    `;
                    ul.appendChild(li);
                });
                
                card.appendChild(ul);
                container.appendChild(card);
            });

            updateProgress(completedTasks, totalTasks);
        }

        function toggleTask(taskId, isChecked) {
            savedProgress[taskId] = isChecked;
            localStorage.setItem('viraj_progress', JSON.stringify(savedProgress)); // Auto-save
            renderDashboard(); // Re-calculate progress
            showToast();
        }

        function updateProgress(completed, total) {
            const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
            document.getElementById('progressBar').style.width = `${percentage}%`;
            document.getElementById('progressText').textContent = `${percentage}%`;
            
            if(percentage === 100) {
                document.getElementById('progressBar').style.background = 'var(--success)';
                document.getElementById('progressText').style.color = 'var(--success)';
            }
        }

        // --- Link Manager Rendering ---
        function populateSubjectDropdown() {
            const select = document.getElementById('linkSubject');
            Object.keys(baseTasks).forEach(sub => {
                select.innerHTML += `<option value="${sub}">${sub}</option>`;
            });
        }

        function renderLinkManager() {
            const container = document.getElementById('currentLinksList');
            container.innerHTML = '';

            Object.keys(savedLinks).forEach(subject => {
                if (savedLinks[subject].length === 0) return;

                const section = document.createElement('div');
                section.style.marginBottom = '20px';
                section.innerHTML = `<h3 style="margin-top:0; color:var(--primary); font-size:1rem;">${subject}</h3>`;
                
                const linkList = document.createElement('div');
                linkList.className = 'file-links';

                savedLinks[subject].forEach((link, index) => {
                    linkList.innerHTML += `
                        <div class="file-btn">
                            <div class="file-btn-content">${fileIcon} ${link.name}</div>
                            <button class="btn-danger" onclick="deleteLink('${subject}', ${index})">Delete</button>
                        </div>
                    `;
                });

                section.appendChild(linkList);
                container.appendChild(section);
            });
        }

        function handleLinkSubmit(e) {
            e.preventDefault();
            const subject = document.getElementById('linkSubject').value;
            const name = document.getElementById('linkName').value;
            const url = document.getElementById('linkUrl').value;

            if (!savedLinks[subject]) savedLinks[subject] = [];
            savedLinks[subject].push({ name, url });

            localStorage.setItem('viraj_links', JSON.stringify(savedLinks)); // Auto-save
            document.getElementById('linkForm').reset();
            renderLinkManager();
            showToast("✅ Link Saved!");
        }

        function deleteLink(subject, index) {
            savedLinks[subject].splice(index, 1);
            localStorage.setItem('viraj_links', JSON.stringify(savedLinks)); // Auto-save
            renderLinkManager();
        }

        // --- Utilities ---
        let toastTimeout;
        function showToast(msg = "✅ Auto-saved!") {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
